[workspace]
members = [
  "crates/syncer-agent",
  "crates/syncer-core",
]
resolver = "3"

[workspace.package]
authors = ["Syncer Contributors"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/syncer/syncer"
rust-version = "1.95"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
blake3 = "1.8.2"
camino = { version = "1.2.1", features = ["serde1"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
hex = "0.4.3"
hmac = "0.12.1"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["derive", "macros", "migrate", "runtime-tokio", "sqlite", "time", "uuid"] }
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "macros", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
uuid = { version = "1.19.0", features = ["serde", "v7"] }
